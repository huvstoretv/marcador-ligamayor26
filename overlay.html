<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay Marcador TV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: transparent; /* Transparente para OBS */
            font-family: 'Roboto Condensed', sans-serif;
            font-weight: 900;
            color: white;
            overflow: hidden;
        }

        .scoreboard-container {
            position: absolute;
            top: 40px;
            left: 40px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .team-row {
            display: flex;
            align-items: stretch;
            position: relative;
            height: 45px;
        }

        /* Indicador de Posesión (Triángulo Naranja) */
        .possession {
            width: 0;
            height: 0;
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
            border-left: 15px solid #ec6608;
            margin-right: 5px;
            align-self: center;
            opacity: 0;
            transition: opacity 0.2s ease-in-out;
        }
        .possession.active {
            opacity: 1;
        }

        /* Contenedor del nombre del equipo */
        .name-box {
            background: linear-gradient(180deg, #333 0%, #111 100%);
            border: 2px solid #ccc;
            border-right: none;
            width: 180px;
            display: flex;
            align-items: center;
            padding-left: 15px;
            font-size: 26px;
            text-transform: uppercase;
            letter-spacing: 1px;
            clip-path: polygon(0 0, 100% 0, 95% 100%, 0 100%);
            z-index: 2;
            position: relative;
        }

        /* Contenedor de la puntuación */
        .score-box {
            background: linear-gradient(180deg, #666 0%, #333 100%);
            border: 2px solid #ccc;
            width: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            margin-left: -10px; /* Efecto de superposición */
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
            z-index: 1;
        }

        /* Tiempos Fuera (Trapezoides Grises) */
        .timeouts-container {
            position: absolute;
            top: -10px;
            left: 35px;
            display: flex;
            gap: 4px;
            z-index: 3;
        }
        .timeout {
            width: 25px;
            height: 8px;
            background-color: #aaa;
            clip-path: polygon(15% 0, 100% 0, 85% 100%, 0 100%);
            transition: opacity 0.3s;
        }
        .timeout.hidden {
            opacity: 0;
        }

        /* Récord (Pequeño detalle arriba) */
        .record-box {
            position: absolute;
            top: -15px;
            right: 80px;
            font-size: 12px;
            background: #eee;
            color: #000;
            padding: 1px 8px;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
        }

        /* Fila Inferior (Cuarto y Castigo) */
        .bottom-row {
            display: flex;
            margin-left: 30px; /* Alineado con las cajas de nombres */
            margin-top: 2px;
            position: relative;
            height: 30px;
        }

        .quarter-box {
            background-color: #e0e0e0;
            color: black;
            border: 2px solid #aaa;
            padding: 2px 15px;
            font-size: 18px;
            clip-path: polygon(0 0, 100% 0, 92% 100%, 0 100%);
            z-index: 5;
            display: flex;
            align-items: center;
            position: relative;
        }

        /* Animación del Castigo */
        .penalty-box {
            background-color: #ffcc00;
            color: black;
            border: 2px solid #ccc;
            padding: 2px 20px 2px 30px; /* Padding extra izquierdo para esconder bajo quarter-box */
            font-size: 18px;
            clip-path: polygon(8% 0, 100% 0, 92% 100%, 0 100%);
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            display: flex;
            align-items: center;
            z-index: 4; /* Debajo de quarter-box */
            
            /* Estado Inicial: Oculto y detrás */
            transform: translateX(-20px);
            opacity: 0;
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s ease-in;
        }

        .penalty-box.active {
            /* Estado Final: Deslizado a la derecha */
            transform: translateX(110px); /* Ajustar según el ancho del quarter-box */
            opacity: 1;
        }

    </style>
</head>
<body>

    <div class="scoreboard-container">
        <!-- EQUIPO 1: PANTERAS -->
        <div class="team-row">
            <div id="poss-t1" class="possession"></div>
            
            <div class="timeouts-container" id="to-t1">
                <div class="timeout"></div>
                <div class="timeout"></div>
                <div class="timeout"></div>
            </div>
            <!-- <div class="record-box">0-3</div> Opcional -->
            
            <div class="name-box" id="name-t1">PANTERAS</div>
            <div class="score-box" id="score-t1">0</div>
        </div>

        <!-- EQUIPO 2: HALCONES -->
        <div class="team-row">
            <div id="poss-t2" class="possession active"></div>
            
            <div class="timeouts-container" id="to-t2">
                <div class="timeout"></div>
                <div class="timeout"></div>
                <div class="timeout"></div>
            </div>
            <!-- <div class="record-box">2-0</div> Opcional -->

            <div class="name-box" id="name-t2">HALCONES</div>
            <div class="score-box" id="score-t2">0</div>
        </div>

        <!-- FILA INFERIOR -->
        <div class="bottom-row">
            <div class="quarter-box" id="quarter-display">1ER. CUARTO</div>
            <div class="penalty-box" id="penalty-display">CASTIGO</div>
        </div>
    </div>

    <script type="module">
        import { db, doc, onSnapshot } from './firebase-config.js';

        // Referencia al documento en Firestore
        const docRef = doc(db, "marcador", "estado");

        onSnapshot(docRef, (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();

                // Nombres
                document.getElementById('name-t1').innerText = data.team1_name || 'PANTERAS';
                document.getElementById('name-t2').innerText = data.team2_name || 'HALCONES';

                // Puntuación
                document.getElementById('score-t1').innerText = data.team1_score;
                document.getElementById('score-t2').innerText = data.team2_score;

                // Posesión
                document.getElementById('poss-t1').classList.toggle('active', data.possession === 1);
                document.getElementById('poss-t2').classList.toggle('active', data.possession === 2);

                // Cuarto
                document.getElementById('quarter-display').innerText = data.quarter;

                // Castigo
                const penaltyBox = document.getElementById('penalty-display');
                if(data.penalty_active) {
                    penaltyBox.classList.add('active');
                } else {
                    penaltyBox.classList.remove('active');
                }

                // Tiempos Fuera Team 1
                const toT1 = document.getElementById('to-t1').children;
                for(let i=0; i<3; i++) {
                    if(i < data.team1_timeouts) toT1[i].classList.remove('hidden');
                    else toT1[i].classList.add('hidden');
                }

                // Tiempos Fuera Team 2
                const toT2 = document.getElementById('to-t2').children;
                for(let i=0; i<3; i++) {
                    if(i < data.team2_timeouts) toT2[i].classList.remove('hidden');
                    else toT2[i].classList.add('hidden');
                }
            }
        });
    </script>
</body>
</html>
