<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay de Marcador - Interactivo</title>
    <style>
        :root {
            /* =========================================
               CONFIGURACIÓN GLOBAL
               ========================================= */
            --fuente-principal: 'Arial', sans-serif;
            --fuente-marcador: 'Impact', sans-serif; 
            --offset-x: 0px; 
            --offset-y: 0px;

            /* =========================================
               MARCADOR (NÚMEROS FLOTANTES)
               ========================================= */
            --marcador-tamaño-fuente: 52px;
            --marcador-color: #FFFFFF;
            --marcador-sombra: 2px 2px 5px rgba(0,0,0,0.9);
            --marcador-ancho: 70px;
            --marcador-alineacion: center;

            --score1-top: calc(52px + var(--offset-y));
            --score1-left: calc(275px + var(--offset-x));

            --score2-top: calc(125px + var(--offset-y));
            --score2-left: calc(275px + var(--offset-x));

            /* =========================================
               TIEMPOS FUERA (INDICADORES)
               ========================================= */
            --timeout-ancho: 15px;
            --timeout-alto: 6px;
            --timeout-color-activo: #FFD700; /* Amarillo */
            --timeout-color-gastado: rgba(255, 255, 255, 0.2); /* Transparente/Apagado */
            --timeout-espaciado: 5px;

            --timeouts1-top: calc(105px + var(--offset-y));
            --timeouts1-left: calc(285px + var(--offset-x));

            --timeouts2-top: calc(180px + var(--offset-y));
            --timeouts2-left: calc(285px + var(--offset-x));

            /* =========================================
               POSESIÓN DEL BALÓN
               ========================================= */
            --posesion-tamaño: 48px; 
            --posesion-color: #F15A24; 
            --posesion-radio-esquinas: 10px; 

            --posesion1-top: calc(55px + var(--offset-y));
            --posesion1-left: calc(20px + var(--offset-x));

            --posesion2-top: calc(128px + var(--offset-y));
            --posesion2-left: calc(20px + var(--offset-x));

            /* =========================================
               SECCIÓN INFERIOR: CUARTO Y CASTIGO
               ========================================= */
            --info-top: calc(200px + var(--offset-y));
            --info-altura: 35px; 
            --info-fuente-tamaño: 20px;
            --info-inclinacion: -12deg; 

            --cuarto-left: calc(45px + var(--offset-x));
            --cuarto-ancho: 130px;
            --cuarto-bg-color: #F0F0F0;
            --cuarto-color-texto: #000000;

            --castigo-left: calc(170px + var(--offset-x)); 
            --castigo-ancho: 130px;
            --castigo-bg-color: #FFC107; 
            --castigo-color-texto: #000000;
        }

        body {
            margin: 0;
            padding: 0;
            width: 1920px;
            height: 1080px;
            background-color: transparent; 
            position: relative;
            font-family: var(--fuente-principal);
            overflow: hidden;
        }

        /* ----- ESTILOS ELEMENTOS ----- */
        .score {
            position: absolute;
            font-family: var(--fuente-marcador);
            font-size: var(--marcador-tamaño-fuente);
            color: var(--marcador-color);
            text-shadow: var(--marcador-sombra);
            width: var(--marcador-ancho);
            text-align: var(--marcador-alineacion);
            z-index: 10;
        }
        #score-team1 { top: var(--score1-top); left: var(--score1-left); }
        #score-team2 { top: var(--score2-top); left: var(--score2-left); }

        .timeouts-container {
            position: absolute;
            display: flex;
            gap: var(--timeout-espaciado);
            z-index: 10;
        }
        #timeouts-team1 { top: var(--timeouts1-top); left: var(--timeouts1-left); }
        #timeouts-team2 { top: var(--timeouts2-top); left: var(--timeouts2-left); }

        .timeout-dot {
            width: var(--timeout-ancho);
            height: var(--timeout-alto);
            background-color: var(--timeout-color-activo);
            border: 1px solid #000;
            border-radius: 2px;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            transition: background-color 0.3s ease;
        }

        .possession {
            position: absolute;
            width: var(--posesion-tamaño);
            height: var(--posesion-tamaño);
            z-index: 10;
            display: none; /* Oculto por defecto, JS lo muestra */
        }
        #possession-team1 { top: var(--posesion1-top); left: var(--posesion1-left); }
        #possession-team2 { top: var(--posesion2-top); left: var(--posesion2-left); }

        .info-box {
            position: absolute;
            top: var(--info-top);
            height: var(--info-altura);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: var(--info-fuente-tamaño);
            font-weight: 900;
            box-sizing: border-box;
            transform: skewX(var(--info-inclinacion));
            border: 2px solid #000000;
            z-index: 5;
        }

        .info-content {
            transform: skewX(calc(var(--info-inclinacion) * -1)); 
            letter-spacing: 1px;
        }

        #quarter-display {
            left: var(--cuarto-left);
            width: var(--cuarto-ancho);
            background-color: var(--cuarto-bg-color);
            color: var(--cuarto-color-texto);
        }

        #penalty-display {
            left: var(--castigo-left);
            width: var(--castigo-ancho);
            background-color: var(--castigo-bg-color);
            color: var(--castigo-color-texto);
            border-left: none; 
            display: none; /* Oculto por defecto */
        }

        /* ANIMACIÓN DEL CASTIGO */
        @keyframes parpadeoAmarillo {
            0%, 100% { background-color: var(--castigo-bg-color); color: #000; }
            50% { background-color: #FFFFFF; color: #D32F2F; }
        }

        .animacion-activa {
            display: flex !important;
            animation: parpadeoAmarillo 1.2s infinite;
        }
    </style>
</head>
<body>

    <!-- Posesión -->
    <svg id="possession-team1" class="possession" viewBox="0 0 100 100">
        <path d="M 20 15 L 85 50 L 20 85 Z" fill="var(--posesion-color)" stroke="var(--posesion-color)" stroke-width="var(--posesion-radio-esquinas)" stroke-linejoin="round" />
    </svg>
    <svg id="possession-team2" class="possession" viewBox="0 0 100 100">
        <path d="M 20 15 L 85 50 L 20 85 Z" fill="var(--posesion-color)" stroke="var(--posesion-color)" stroke-width="var(--posesion-radio-esquinas)" stroke-linejoin="round" />
    </svg>

    <!-- Marcadores -->
    <div id="score-team1" class="score">0</div>
    <div id="score-team2" class="score">0</div>

    <!-- Tiempos Fuera Equipo 1 -->
    <div id="timeouts-team1" class="timeouts-container">
        <div class="timeout-dot" id="t1-1"></div>
        <div class="timeout-dot" id="t1-2"></div>
        <div class="timeout-dot" id="t1-3"></div>
    </div>

    <!-- Tiempos Fuera Equipo 2 -->
    <div id="timeouts-team2" class="timeouts-container">
        <div class="timeout-dot" id="t2-1"></div>
        <div class="timeout-dot" id="t2-2"></div>
        <div class="timeout-dot" id="t2-3"></div>
    </div>

    <!-- Cuarto y Castigo -->
    <div id="quarter-display" class="info-box">
        <span id="quarter-text" class="info-content">1ER CUARTO</span>
    </div>
    <div id="penalty-display" class="info-box">
        <span class="info-content">CASTIGO</span>
    </div>


    <!-- ==========================================
         SCRIPT DE CONEXIÓN A FIREBASE Y LÓGICA
         ========================================== -->
    <script type="module">
        // 1. Importar librerías de Firebase v9
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // 2. PEGA AQUÍ TU CONFIGURACIÓN DE FIREBASE
        // Sustituye el contenido de "firebaseConfig" con los datos de tu proyecto
        const firebaseConfig = {
            apiKey: "AIzaSyD0_heqgUdn0yjLYEPEVdOCkYhN8InZ09k",
            authDomain: "marcador-ligamayor26.firebaseapp.com",
            projectId: "marcador-ligamayor26",
            storageBucket: "marcador-ligamayor26.firebasestorage.app",
            messagingSenderId: "470066357306",
            appId: "1:470066357306:web:bcc181b2900596c198c103"
        };

        // 3. Inicializar App y Base de Datos
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 4. Referencias del DOM (HTML)
        const score1El = document.getElementById('score-team1');
        const score2El = document.getElementById('score-team2');
        const pos1El = document.getElementById('possession-team1');
        const pos2El = document.getElementById('possession-team2');
        const quarterText = document.getElementById('quarter-text');
        const penaltyBox = document.getElementById('penalty-display');

        // Función para actualizar Tiempos Fuera visualmente
        function updateTimeouts(team, count) {
            for(let i=1; i<=3; i++) {
                const dot = document.getElementById(`t${team}-${i}`);
                if(i <= count) {
                    dot.style.backgroundColor = "var(--timeout-color-activo)";
                } else {
                    dot.style.backgroundColor = "var(--timeout-color-gastado)";
                }
            }
        }

        // 5. Escuchar cambios en Firestore en TIEMPO REAL
        // Asegúrate de que "marcador" y "estado" coincidan con la ruta de tu panel.html
        const docRef = doc(db, "marcador", "estado");
        
        onSnapshot(docRef, (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();

                // Actualizar Puntos
                if (data.score1 !== undefined) score1El.innerText = data.score1;
                if (data.score2 !== undefined) score2El.innerText = data.score2;

                // Actualizar Cuarto
                if (data.cuarto) quarterText.innerText = data.cuarto.toUpperCase();

                // Actualizar Posesión
                pos1El.style.display = (data.posesion === 1) ? 'block' : 'none';
                pos2El.style.display = (data.posesion === 2) ? 'block' : 'none';

                // Actualizar Animación de Castigo (Pañuelo)
                if (data.castigo === true) {
                    penaltyBox.classList.add('animacion-activa');
                } else {
                    penaltyBox.classList.remove('animacion-activa');
                }

                // Actualizar Tiempos Fuera (Timeouts)
                if (data.timeouts1 !== undefined) updateTimeouts(1, data.timeouts1);
                if (data.timeouts2 !== undefined) updateTimeouts(2, data.timeouts2);

            } else {
                console.log("No se encontró el documento de la base de datos.");
            }
        });
    </script>
</body>
</html>
