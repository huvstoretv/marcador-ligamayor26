<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay Marcador - Sin Contenedores</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* =========================================
               VARIABLES DE POSICIÓN, TAMAÑO Y COLOR
               MODIFICA ESTOS VALORES PARA AJUSTAR A TU IMAGEN
               ========================================= */
               
            --fuente-marcador: 'Roboto Condensed', sans-serif;

            /* --- NÚMEROS DEL MARCADOR --- */
            --score-font-size: 58px;
            --score-color: #FFFFFF;
            /* Si necesitas sombra para que resalten, aumenta los valores rgba */
            --score-shadow: 2px 2px 4px rgba(0,0,0,0.8);

            /* Posición Puntuación Arriba (Ej. Panteras) */
            --score1-x: 320px; 
            --score1-y: 25px;

            /* Posición Puntuación Abajo (Ej. Halcones) */
            --score2-x: 275px; 
            --score2-y: 112px;

            /* --- POSESIÓN (TRIÁNGULO NARANJA) --- */
            --pos-size: 40px;
            --pos-color: #F15A24;
            --pos-radio: 8px; /* Redondeo de las esquinas del triángulo */

            /* Posición Triángulo Arriba */
            --pos1-x: 0px;
            --pos1-y: 50px;

            /* Posición Triángulo Abajo */
            --pos2-x: 0px;
            --pos2-y: 120px;

            /* --- TIEMPOS FUERA (TRAPEZOIDES GRISES) --- */
            --to-ancho: 28px;
            --to-alto: 8px;
            --to-color: #808080;
            --to-espacio: 6px;

            /* Posición Tiempos Fuera Arriba */
            --to1-x: 35px;
            --to1-y: 35px;

            /* Posición Tiempos Fuera Abajo */
            --to2-x: 35px;
            --to2-y: 105px;

            /* --- INDICADOR DE CUARTO --- */
            --quarter-font-size: 20px;
            --quarter-color: #000000;
            --quarter-x: 45px;
            --quarter-y: 195px;

            /* --- INDICADOR DE CASTIGO --- */
            --castigo-font-size: 20px;
            --castigo-bg: #FFC107;
            --castigo-borde: 2px solid #D3D3D3;
            --castigo-color: #000000;
            
            --castigo-x: 165px; /* Debería estar justo a la derecha del cuarto */
            --castigo-y: 190px;
            --castigo-ancho: 120px;
            --castigo-alto: 32px;
            --castigo-inclinacion: -12deg; /* Para el formato trapezoide */
        }

        body {
            margin: 0;
            padding: 0;
            width: 1920px;
            height: 1080px;
            background-color: transparent; 
            overflow: hidden;
            font-family: var(--fuente-marcador);
            font-weight: 900;
        }

        /* --- CLASES CSS BASE --- */
        .score {
            position: absolute;
            font-size: var(--score-font-size);
            color: var(--score-color);
            text-shadow: var(--score-shadow);
            z-index: 10;
        }

        .possession {
            position: absolute;
            width: var(--pos-size);
            height: var(--pos-size);
            z-index: 10;
            display: none; /* Oculto por defecto, se activa por JS */
            transition: opacity 0.3s;
        }

        .timeouts-container {
            position: absolute;
            display: flex;
            gap: var(--to-espacio);
            z-index: 10;
        }

        .timeout-mark {
            width: var(--to-ancho);
            height: var(--to-alto);
            background-color: var(--to-color);
            /* Forma de trapezoide inclinado a la derecha */
            clip-path: polygon(15% 0, 100% 0, 85% 100%, 0% 100%);
            transition: opacity 0.3s;
        }

        .quarter-text {
            position: absolute;
            left: var(--quarter-x);
            top: var(--quarter-y);
            font-size: var(--quarter-font-size);
            color: var(--quarter-color);
            z-index: 5; /* Z-index mayor que castigo para que pase por detrás */
        }

        /* Contenedor del Castigo */
        .castigo-wrapper {
            position: absolute;
            left: var(--castigo-x);
            top: var(--castigo-y);
            width: var(--castigo-ancho);
            height: var(--castigo-alto);
            z-index: 1; /* Detrás del texto del cuarto */
            /* El overflow hidden es opcional si quieres que el pañuelo emerja desde un corte invisible */
        }

        .castigo-box {
            width: 100%;
            height: 100%;
            background-color: var(--castigo-bg);
            border: var(--castigo-borde);
            color: var(--castigo-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: var(--castigo-font-size);
            box-sizing: border-box;
            
            /* Inclinación y Forma */
            transform: skewX(var(--castigo-inclinacion)) translateX(-100%);
            opacity: 0;
            
            /* Animación de deslizamiento y fade */
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s ease-in;
        }

        /* Enderezar el texto dentro de la caja inclinada */
        .castigo-box span {
            transform: skewX(calc(var(--castigo-inclinacion) * -1));
        }

        /* Estado Activo del Castigo */
        .castigo-box.active {
            transform: skewX(var(--castigo-inclinacion)) translateX(0);
            opacity: 1;
        }

        /* Asignación de Posiciones Absolutas */
        #score1 { left: var(--score1-x); top: var(--score1-y); }
        #score2 { left: var(--score2-x); top: var(--score2-y); }
        #pos1 { left: var(--pos1-x); top: var(--pos1-y); }
        #pos2 { left: var(--pos2-x); top: var(--pos2-y); }
        #to1 { left: var(--to1-x); top: var(--to1-y); }
        #to2 { left: var(--to2-x); top: var(--to2-y); }

    </style>
</head>
<body>

    <!-- POSESIÓN (TRIÁNGULOS REDONDEADOS SVG) -->
    <svg id="pos1" class="possession" viewBox="0 0 100 100">
        <path d="M 20 15 L 85 50 L 20 85 Z" fill="var(--pos-color)" stroke="var(--pos-color)" stroke-width="var(--pos-radio)" stroke-linejoin="round" />
    </svg>
    <svg id="pos2" class="possession" viewBox="0 0 100 100">
        <path d="M 20 15 L 85 50 L 20 85 Z" fill="var(--pos-color)" stroke="var(--pos-color)" stroke-width="var(--pos-radio)" stroke-linejoin="round" />
    </svg>

    <!-- TIEMPOS FUERA (TRAPEZOIDES) -->
    <div id="to1" class="timeouts-container">
        <div class="timeout-mark" id="to1-1"></div>
        <div class="timeout-mark" id="to1-2"></div>
        <div class="timeout-mark" id="to1-3"></div>
    </div>
    <div id="to2" class="timeouts-container">
        <div class="timeout-mark" id="to2-1"></div>
        <div class="timeout-mark" id="to2-2"></div>
        <div class="timeout-mark" id="to2-3"></div>
    </div>

    <!-- NÚMEROS DEL MARCADOR -->
    <div id="score1" class="score">0</div>
    <div id="score2" class="score">0</div>

    <!-- TEXTO DEL CUARTO (SIN CONTENEDOR) -->
    <div class="quarter-text" id="quarter">1ER. CUARTO</div>

    <!-- INDICADOR DE CASTIGO ANIMADO (CON CONTENEDOR) -->
    <div class="castigo-wrapper">
        <div class="castigo-box" id="castigo">
            <span>CASTIGO</span>
        </div>
    </div>


    <!-- ==========================================
         SCRIPT DE CONEXIÓN A FIREBASE Y LÓGICA
         ========================================== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // PEGA AQUÍ TU CONFIGURACIÓN DE FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyD0_heqgUdn0yjLYEPEVdOCkYhN8InZ09k",
            authDomain: "marcador-ligamayor26.firebaseapp.com",
            projectId: "marcador-ligamayor26",
            storageBucket: "marcador-ligamayor26.firebasestorage.app",
            messagingSenderId: "470066357306",
            appId: "1:470066357306:web:bcc181b2900596c198c103"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const docRef = doc(db, "marcador", "estado");

        // Referencias al DOM
        const score1El = document.getElementById('score1');
        const score2El = document.getElementById('score2');
        const pos1El = document.getElementById('pos1');
        const pos2El = document.getElementById('pos2');
        const quarterEl = document.getElementById('quarter');
        const castigoEl = document.getElementById('castigo');

        function updateTimeouts(team, count) {
            for(let i=1; i<=3; i++) {
                const toMark = document.getElementById(`to${team}-${i}`);
                // Si i es mayor que los timeouts restantes, lo ocultamos bajando la opacidad a 0
                toMark.style.opacity = (i <= count) ? '1' : '0';
            }
        }

        onSnapshot(docRef, (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();

                // Marcador
                if (data.score1 !== undefined) score1El.innerText = data.score1;
                if (data.score2 !== undefined) score2El.innerText = data.score2;

                // Posesión
                pos1El.style.display = (data.posesion === 1) ? 'block' : 'none';
                pos2El.style.display = (data.posesion === 2) ? 'block' : 'none';

                // Tiempos Fuera
                if (data.timeouts1 !== undefined) updateTimeouts(1, data.timeouts1);
                if (data.timeouts2 !== undefined) updateTimeouts(2, data.timeouts2);

                // Cuarto
                if (data.cuarto) quarterEl.innerText = data.cuarto;

                // Castigo (Animación)
                if (data.castigo === true) {
                    castigoEl.classList.add('active');
                } else {
                    castigoEl.classList.remove('active');
                }
            }
        });
    </script>
</body>
</html>
